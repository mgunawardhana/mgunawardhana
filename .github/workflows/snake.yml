# ╔══════════════════════════════════════════════════════════════╗
# ║  🐍 CONTRIBUTION SNAKE GENERATOR                               ║
# ║                                                                ║
# ║  📁 Place this file at:                                        ║
# ║     .github/workflows/snake.yml                                ║
# ║     inside your profile repo: mGunawardhana/mGunawardhana      ║
# ║                                                                ║
# ║  ⚙️ One-time setup:                                            ║
# ║     Repo → Settings → Actions → General →                      ║
# ║     Workflow permissions → "Read and write permissions" → Save ║
# ║                                                                ║
# ║  ▶️ First run:                                                 ║
# ║     Actions tab → "🐍 Generate Snake Animation" → Run workflow ║
# ║     (after ~1 min the snake appears in your README)            ║
# ╚══════════════════════════════════════════════════════════════╝

name: 🐍 Generate Snake Animation

on:
  # Regenerate every 12 hours so the snake stays in sync with your commits
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Regenerate whenever you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Generate the snake SVGs (neon-green snake, matching profile theme) ──
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2ed573
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2ed573

      # ── Publish the SVGs to the "output" branch (used by the README) ──
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
